name: Downloads badge

# Atualiza docs/downloads.json (selo de downloads do README) uma vez por dia
# e sempre que uma release é publicada.
on:
  schedule:
    - cron: '17 5 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: downloads-badge
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Count installer downloads
        run: node scripts/downloads-badge.mjs ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/downloads.json; then
            echo "sem mudanças"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads.json
          git commit -m "chore: update downloads badge [skip ci]"
          git push
